<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>k-chart · 期货加权行情</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar" id="toolbar">
      <div class="brand">k-chart</div>
      <div id="symbol-picker" class="symbol-picker">
        <button id="symbol-prev" type="button" class="symbol-step" title="上一个品种（PageUp）" aria-label="上一个品种">‹</button>
        <button id="symbol-button" type="button" class="symbol-button" title="选择品种（可输入中文名或合约代码筛选）">
          <span id="symbol-label">加载中…</span><span class="symbol-caret">▾</span>
        </button>
        <button id="symbol-next" type="button" class="symbol-step" title="下一个品种（PageDown）" aria-label="下一个品种">›</button>
        <select id="symbol" aria-label="合约" hidden></select>
        <div id="symbol-dropdown" class="symbol-dropdown" hidden>
          <input id="symbol-search" type="text" autocomplete="off" placeholder="输入品种中文名或合约代码，如 豆 / r" />
          <div id="symbol-list" class="symbol-list"></div>
        </div>
      </div>
      <div id="periods" class="segmented"></div>
      <div class="spacer"></div>
      <span id="quote" class="quote"></span>
      <button id="tool-select" class="btn" title="选择 / 移动图形（Esc）"><span class="sel-ico">↖</span><span class="sel-txt">选择</span></button>
      <button id="auto-lines" class="btn" title="自动画支撑线 / 压力线 / 通道线">自动线</button>
      <button id="vix-toggle" class="btn" title="叠加 30 天隐波指数（独立纵轴）">隐波</button>
      <button id="nine-toggle" class="btn" title="神奇九转：1~9 / 13 数字标记（可点图例齿轮设置）">九转</button>
      <button id="latest" class="btn primary" title="回到最新 K 线">最新</button>
      <button id="multiview" class="btn" title="四视图：30分 / 60分 / 日线 / 周线（再点一次还原）">四视图</button>
      <button id="toolbar-more" class="btn toolbar-more" title="更多功能" aria-label="更多功能">☰</button>
      <div id="toolbar-extra" class="toolbar-extra">
        <button id="fitall" class="btn" title="显示全部历史">全部</button>
        <button id="overlay" class="btn" title="主图叠加指标">叠加</button>
        <button id="support-dec" class="btn" title="收掉最近一条支撑线">− 支撑</button>
        <button id="support-inc" class="btn" title="往前纳入更早的支撑线">+ 支撑</button>
        <select id="indicator" aria-label="副图指标"></select>
        <button id="addpane" class="btn" title="添加副图指标">+ 附图</button>
        <button id="delpane" class="btn" title="移除最后一个副图">− 附图</button>
        <button id="compare-btn" class="btn" title="多品种对比">对比</button>
        <a id="vix-page" class="btn" href="./vix.html" title="查看全品种隐波总览">VIX总览</a>
        <button id="tools" class="btn" title="绘图工具">画图</button>
        <button id="alert-btn" class="btn" title="价格警报">警报</button>
        <select id="template" title="布局模板">
          <option value="">模板</option>
          <option value="__save__">保存为模板…</option>
          <option value="__delete__">删除当前模板…</option>
        </select>
        <button id="layout-save" class="btn" title="保存当前布局">存</button>
        <button id="layout-load" class="btn" title="恢复上次布局">读</button>
        <button id="cmd-btn" class="btn" title="命令面板 /">⌘</button>
        <button id="snapshot" class="btn" title="导出 PNG 截图">图</button>
        <button id="fullscreen" class="btn" title="全屏">全屏</button>
      </div>
      <span id="status" class="status">初始化…</span>
    </header>

    <main id="chart">
      <canvas id="canvas"></canvas>

      <div id="multi-chart" class="multi-chart" hidden></div>

      <div id="pane-menu" class="pane-menu" hidden>
        <div class="pane-menu-head"><span>副图设置</span><span id="pane-menu-close" class="pane-menu-close">×</span></div>
        <label for="pane-menu-indicator">指标</label>
        <select id="pane-menu-indicator"></select>
        <div class="pane-menu-actions">
          <button id="pane-menu-settings" class="btn">指标设置</button>
          <button id="pane-menu-reset" class="btn">复位比例</button>
          <button id="pane-menu-delete" class="btn">删除</button>
        </div>
      </div>

      <div id="indicator-settings" class="settings-dialog" hidden>
        <div class="settings-head">
          <span id="settings-title">指标设置</span>
          <span id="settings-close" class="pane-menu-close">×</span>
        </div>
        <div class="settings-tabs">
          <button id="settings-tab-inputs" class="tab active">输入</button>
          <button id="settings-tab-style" class="tab">样式</button>
        </div>
        <div id="settings-body" class="settings-body"></div>
        <div class="settings-foot">
          <button id="settings-delete" class="btn">删除</button>
          <span class="spacer"></span>
          <button id="settings-reset" class="btn">重置</button>
          <button id="settings-cancel" class="btn">取消</button>
          <button id="settings-ok" class="btn primary">确定</button>
        </div>
      </div>

      <div id="overlay-menu" class="popup-menu" hidden></div>
      <div id="auto-lines-menu" class="popup-menu" hidden></div>
      <div id="tools-menu" class="popup-menu" hidden></div>
      <button id="pane-switch-anchor" hidden></button>
      <div id="pane-switch-menu" class="popup-menu" hidden></div>

      <div id="shape-props" class="shape-props" hidden>
        <span id="shape-props-type">图形</span>
        <span class="shape-tip" title="拖动线可整体移动，拖动端点可改变形状">拖动移动 · 端点改形</span>
        <input type="color" id="shape-color" title="颜色">
        <input type="number" id="shape-width" min="0.6" max="6" step="0.1" title="线宽">
        <button id="shape-delete" class="btn">删除</button>
        <span id="shape-props-close" class="pane-menu-close">×</span>
      </div>

      <div id="compare-panel" class="popup-panel" hidden>
        <div class="popup-head"><span>多品种对比</span><span id="compare-close" class="pane-menu-close">×</span></div>
        <p class="popup-tip">按时间对齐，统一换算为涨跌幅（%）</p>
        <select id="compare-symbol" aria-label="对比合约"></select>
        <div class="popup-actions">
          <button id="compare-enable" class="btn primary">启用</button>
          <button id="compare-disable" class="btn">关闭</button>
        </div>
      </div>

      <div id="alert-panel" class="popup-panel" hidden>
        <div class="popup-head"><span>价格警报</span><span id="alert-close" class="pane-menu-close">×</span></div>
        <label>合约<input id="alert-symbol" type="text" placeholder="RBL9"></label>
        <label>方向<select id="alert-dir"><option value="above">上破</option><option value="below">下破</option></select></label>
        <label>价格<input id="alert-price" type="number" step="0.01" placeholder="0.00"></label>
        <div class="popup-actions"><button id="alert-add" class="btn primary">添加警报</button></div>
        <div id="alert-list" class="alert-list"></div>
      </div>

      <div id="cmd-palette" class="cmd-palette" hidden>
        <input id="cmd-input" placeholder="输入命令、指标或工具…" autocomplete="off" />
        <div id="cmd-list" class="cmd-list"></div>
      </div>
    </main>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
